# For string values. 
file:                               # .xlsx, .csv, .tsv
	id:                               # Name of column for row-wise comparison
	columns:                          # Columns to compare
	ignore_case:                      # True or False
	ignore_whitespace:                # True or False
	
# For numerical values. 
file:                               # .xlsx, .csv, .tsv
	id:                               # Name of column for row-wise comparison
	columns:                          # Columns to compare
	tolerance:                        # Tolerance can be as absolute value or percent (e.g., 0.25 or 10%)